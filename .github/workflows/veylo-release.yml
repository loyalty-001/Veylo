name: Publish Veylo release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: veylo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPECTED_SIGNER_SHA256: 42c775477187eb2c1e94c867a33374a23728a41df5813695a6e6dc0d4a5a8719
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release source and version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(python3 -c 'import re; print(re.search(r"versionName\s*=\s*\"([^\"]+)\"", open("app/build.gradle.kts").read())[1])')
          test "$GITHUB_REF_NAME" = "v$version"
          version_code=$(python3 -c 'import re; print(re.search(r"versionCode\s*=\s*(\d+)", open("app/build.gradle.kts").read())[1])')
          previous_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          previous_code=$(git show "$previous_tag:app/build.gradle.kts" | python3 -c 'import re,sys; print(re.search(r"versionCode\s*=\s*(\d+)", sys.stdin.read())[1])')
          test "$version_code" -gt "$previous_code"
          printf 'RELEASE_VERSION_CODE=%s\n' "$version_code" >> "$GITHUB_ENV"
          git fetch --depth 1 https://github.com/Flow-Tube/Flow.git 52c4928e5af05141080f46f6c1e41cbf9c457023
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure build memory
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Set ANDROID_KEYSTORE_BASE64 in repository Actions secrets}"
          : "${STORE_PASSWORD:?Set STORE_PASSWORD in repository Actions secrets}"
          : "${KEY_ALIAS:?Set KEY_ALIAS in repository Actions secrets}"
          : "${KEY_PASSWORD:?Set KEY_PASSWORD in repository Actions secrets}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          keytool -list -keystore release.keystore -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null
      - name: Test and build signed APKs
        run: ./gradlew ktlintCheck :app:testGithubDebugUnitTest --tests 'io.github.aedev.flow.data.update.*' --tests 'io.github.aedev.flow.data.operations.*' --tests 'io.github.aedev.flow.ui.startup.*' --tests 'io.github.aedev.flow.ui.screens.settings.DonationsScreenTest' --tests 'io.github.aedev.flow.ui.screens.settings.DiagnosticsAndAboutTest' --tests 'io.github.aedev.flow.ui.components.donation.DonationScheduleTest' --tests 'io.github.aedev.flow.updater.*' --tests 'io.github.aedev.flow.player.googlecast.*' --tests 'io.github.aedev.flow.player.dlna.*' --tests 'io.github.aedev.flow.ui.components.layout.navigation.FlowNavigationBarTest' --tests 'io.github.aedev.flow.ui.components.FeedGridLayoutTest' --tests 'io.github.aedev.flow.ui.components.shared.FeedGridPlanTest' --tests 'io.github.aedev.flow.ui.screens.library.LibrarySectionVisibilityTest' :app:compileFossDebugKotlin :app:assembleGithubRelease --no-daemon
      - name: Prepare release assets
        run: python3 .github/scripts/prepare_veylo_release.py
      - name: Verify APK identity and signatures
        run: |
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > signer-info.txt
            grep -Fxq "Number of signers: 1" signer-info.txt
            grep -Fxq "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" signer-info.txt
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > package-info.txt
            IFS= read -r package_info < package-info.txt
            [[ "$package_info" == *"name='io.github.loyalty001.veylo'"* ]]
            [[ "$package_info" == *"versionCode='$RELEASE_VERSION_CODE'"* ]]
            [[ "$package_info" == *"versionName='${GITHUB_REF_NAME#v}'"* ]]
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          notes_args=(--notes "Official Veylo ${GITHUB_REF_NAME#v} release.")
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Veylo ${GITHUB_REF_NAME#v}" "${notes_args[@]}" dist/*.apk dist/SHA256SUMS
      - name: Remove signing key
        if: always()
        run: rm -f release.keystore
