name: Regenerate Veylo baseline profiles

on:
  push:
    branches: [feat/admin-operations]
    paths:
      - '.github/workflows/veylo-profiles.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veylo-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'loyalty-001/Veylo' && github.ref == 'refs/heads/feat/admin-operations'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch formatting baseline
        run: git fetch --depth 1 https://github.com/Flow-Tube/Flow.git 52c4928e5af05141080f46f6c1e41cbf9c457023
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure build memory
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate startup and feed profiles on managed Pixel 6
        run: |
          ./gradlew :app:generateBaselineProfile -PbaselineProfileEmulator=true --no-configuration-cache --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: Veylo-Baseline-Profiles
          path: app/src/main/generated/baselineProfiles/*
          if-no-files-found: error
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Veylo-Profile-Test-Reports
          path: benchmark/build/reports/androidTests/
          if-no-files-found: ignore
