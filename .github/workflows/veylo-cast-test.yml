name: Build signed Cast test update

on:
  push:
    branches: [fix/google-tv-casting]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veylo-cast-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'loyalty-001/Veylo' && github.ref == 'refs/heads/fix/google-tv-casting'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SIGNER_SHA256: 42c775477187eb2c1e94c867a33374a23728a41df5813695a6e6dc0d4a5a8719
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch formatting baseline
        run: git fetch --depth 1 https://github.com/Flow-Tube/Flow.git 52c4928e5af05141080f46f6c1e41cbf9c457023
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure build memory
        run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Label candidate without changing the stable source version or install code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          source = p.read_text()
          p.write_text(re.sub(r'(versionName\s*=\s*")([^"\n]+)(")', lambda m: m[1] + m[2] + '-cast-test' + m[3], source, count=1))
          PY
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing signing key}"
          : "${STORE_PASSWORD:?Missing signing password}"
          : "${KEY_ALIAS:?Missing key alias}"
          : "${KEY_PASSWORD:?Missing key password}"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Test and build candidate
        run: >
          ./gradlew ktlintCheck :app:testGithubDebugUnitTest
          --tests 'io.github.aedev.flow.data.update.*'
          --tests 'io.github.aedev.flow.updater.*'
          --tests 'io.github.aedev.flow.player.googlecast.*'
          --tests 'io.github.aedev.flow.player.dlna.*'
          --tests 'io.github.aedev.flow.ui.components.layout.navigation.FlowNavigationBarTest'
          :app:compileFossDebugKotlin :app:assembleGithubRelease --no-daemon
      - name: Verify and package signed update
        run: |
          mkdir -p dist
          apk=app/build/outputs/apk/github/release/app-github-universal-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > signer-info.txt
          grep -Fxq "Number of signers: 1" signer-info.txt
          grep -Fxq "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" signer-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > package-info.txt
          IFS= read -r package_info < package-info.txt
          [[ "$package_info" == *"name='io.github.loyalty001.veylo'"* ]]
          [[ "$package_info" == *"versionCode='21'"* ]]
          [[ "$package_info" == *"versionName='3.0.2-cast-test'"* ]]
          cp "$apk" dist/Veylo-Cast-Test.apk
          (cd dist && sha256sum Veylo-Cast-Test.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: Veylo-Cast-Test
          path: dist/*
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f release.keystore
